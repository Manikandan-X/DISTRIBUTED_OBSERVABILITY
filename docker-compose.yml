    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      ingestion-service:
        condition: service_healthy
      query-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
